services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rk
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
      POSTGRES_DB: rkluxmnl
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["rk-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rk -d rkluxmnl"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rk-postgres:
